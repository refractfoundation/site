findings:
  - title: Access to technology is strong, but inequalities remain
    text: "Smartphone access among participating students is almost universal, demonstrating that most young people have a reliable means of accessing digital services. However, access to devices better suited to education is less consistent. Around one in six students reported no access to a laptop, while over one in three lacked access to a desktop computer. This highlights that internet access alone does not guarantee equal opportunities to develop digital skills or complete technology-based schoolwork."
  - title: Students are confident with everyday technology but less prepared for professional digital environments
    text: "Students expressed high confidence using smartphones and general computer technology, reflecting their familiarity with everyday digital tools. Confidence was noticeably lower when carrying out tasks associated with education and employment, particularly sending emails with attachments. This suggests that schools have an important role in developing workplace-ready digital skills alongside general digital confidence."
  - title: Cybersecurity awareness is encouraging, but practical resilience requires further development
    text: "Most students reported that they could identify scams and felt safe online. However, a significant minority were unsure how to respond if an online account became compromised or how to determine whether a website could be trusted. In addition, many students reported having encountered scams or suspicious online content. These findings indicate that cybersecurity education should increasingly focus on practical decision-making and real-world scenarios rather than awareness alone."
  - title: Artificial intelligence has become part of students' everyday learning
    text: "The overwhelming majority of students have used artificial intelligence tools, with many reporting that they use them to support homework, explain difficult topics and summarise information. Most respondents also believe that AI benefits learning more than it harms it. As AI becomes increasingly integrated into education, schools should continue developing guidance that encourages responsible, ethical and effective use rather than discouraging its adoption."
  - title: Students value practical digital skills education
    text: "While many respondents reported feeling well supported, those requesting additional help consistently favoured practical learning approaches. Students highlighted a desire for more hands-on teaching, clearer explanations, cybersecurity education and personalised support. These findings suggest that practical digital literacy activities may have greater impact than purely theoretical instruction."

recommendations:
  - Continue embedding digital literacy across the curriculum rather than limiting it to computing lessons.
  - Increase opportunities for students to practise professional digital skills, including email communication, file management and collaborative working.
  - Deliver regular, scenario-based cybersecurity education covering phishing, scams, password management and account recovery.
  - Develop clear guidance on the safe, responsible and effective use of artificial intelligence within learning.
  - Identify students experiencing digital disadvantage and provide targeted support where appropriate through device access schemes, additional training or personalised interventions.
  - Repeat Census annually to measure progress, evaluate interventions and identify emerging trends over time.

staff_note: "The staff survey had a small sample, so results are shown for the whole group only and should be read as indicative."
