# Short commentary shown with each section. Omit a key to hide it.
insights:
  access: "Smartphone access is almost universal, but smartphones are not a complete substitute for larger devices when completing coursework, creating documents or using specialist software. Tablets are widespread, though a notable proportion rely on shared devices or have none. Most students have a laptop, but almost half of these rely on a shared household device. Desktop computer access is the lowest of the four, with over one-third of students reporting none, which may be a barrier to programming, multimedia creation and other resource-intensive work."
  confidence: "Students reported the greatest confidence using smartphones and maintaining passwords, reflecting familiarity with everyday technology. Confidence was noticeably lower for sending emails and attachments, suggesting professional digital communication remains an area for development."
  learning: "Digital literacy is developed through a combination of formal education and independent learning. School remains the primary source, but students frequently supplement this through online resources and support from family, highlighting the importance of encouraging safe independent learning."
  ai: "AI tools have already become mainstream among students. Rather than preventing AI use, schools should focus on teaching responsible, critical and ethical use, ensuring students understand both the opportunities and limitations of generative AI."

