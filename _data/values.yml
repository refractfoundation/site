- letter: A
  name: Accessibility
  description: Designing programmes, resources, and experiences that are inclusive, easy to understand, and accessible to people with different backgrounds, abilities, and levels of digital confidence.
  background: /assets/images/campfire/4.JPG
- letter: R
  name: Responsibility
  description: Making thoughtful, evidence-based decisions, delivering on our commitments, and ensuring our work is ethical, sustainable, and achievable with the resources available.
  background: /assets/images/campfire/22.JPG
- letter: E
  name: Empowerment
  description: Equipping people with the knowledge, confidence, and practical skills they need to use technology safely, effectively, and independently.
  background: /assets/images/campfire/6.JPG
- letter: A
  name: Authenticity
  description: Being honest, transparent, and accountable in everything we do, celebrating successes while being open about challenges, limitations, and opportunities to improve.
  background: /assets/images/campfire/10.JPG
