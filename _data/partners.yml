# Every partner, keyed by id. Pages list the ids they want (see home.yml and _events/*.md).
#
# colour:  the partner's own colour; tints and outlines the card
# dark:    true for logos that are white or made for dark backgrounds (shown on a dark tile)
# invert:  true for white logos on transparent backgrounds (inverted to black on the light tile)
# logo:    omit if there is no logo file yet; the card shows the partner's name instead
# w / h:   pixel size of the logo, so the card reserves its space

