  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var addAccessibleFrameName = function (iframe) {
        if (!iframe || iframe.getAttribute("title")) return;
        iframe.setAttribute("title", "Embedded content");
      };

      document.querySelectorAll("iframe").forEach(addAccessibleFrameName);

      if (document.body) {
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (node.nodeType !== Node.ELEMENT_NODE) return;
              if (node.tagName === "IFRAME") {
                addAccessibleFrameName(node);
              }
              if (node.querySelectorAll) {
                node.querySelectorAll("iframe").forEach(addAccessibleFrameName);
              }
            });
          });
        });

        observer.observe(document.body, { childList: true, subtree: true });
      }

      var carousel = document.querySelector("#image-carousel.splide");

      if (carousel) {
        var splide = new Splide(carousel, {
          type: "loop",
          drag: "free",
          focus: "center",
          perPage: 3,
          gap: "1rem",
          autoScroll: {
            speed: 1,
          },
        });

        splide.mount(window.splide.Extensions);
      }
    });
  </script>
