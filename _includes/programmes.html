<div class="container text-center">
  <div class="row row-cols-1 row-cols-md-2 g-3">
    {% for programme in site.data.programmes %}
    <div class="col">
      <div
        class="event-card event-card--bg d-flex flex-column justify-content-between align-items-center text-center"
        style="--event-card-image: url({{ programme.background }}); border-top: 4px solid {{ programme.colour }};"
      >
        <img
          src="{{ programme.logo }}"
          alt="{{ programme.name }}"
          class="programme-logo"
        />
        <h4>{{ programme.description }}</h4>
        <a class="btn" href="{{ programme.url }}" style="--btn-bg: {{ programme.colour }};" aria-label="Read more about {{ programme.name }}">Read More ></a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
