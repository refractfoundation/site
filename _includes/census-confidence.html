{%- comment -%} Average confidence out of 5. Pass: items (confidence array from results.json). {%- endcomment -%}
<ul class="bars bars--confidence">
  {%- for item in include.items %}
  {%- assign pct = item.average | times: 20 %}
  <li class="bars__row">
    <span class="bars__label">{{ item.label }}</span>
    <span class="bars__track" aria-hidden="true"><span class="bars__fill" style="width: {{ pct }}%"></span></span>
    <span class="bars__value">{{ item.average }} <small>/ 5</small></span>
  </li>
  {%- endfor %}
</ul>
