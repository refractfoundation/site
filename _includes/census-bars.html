{%- comment -%} Horizontal bar chart for one question. Pass: q (a question object from results.json). {%- endcomment -%}
{%- assign q = include.q -%}
<figure class="chart">
  <figcaption class="chart__title">{{ q.label }} <span class="chart__n">({{ q.n }} responses)</span></figcaption>
  <ul class="bars">
    {%- for opt in q.options %}
    {%- assign pct = opt.count | times: 100.0 | divided_by: q.n | round %}
    <li class="bars__row">
      <span class="bars__label">{{ opt.label }}</span>
      <span class="bars__track" aria-hidden="true"><span class="bars__fill" style="width: {{ pct }}%"></span></span>
      <span class="bars__value">{{ opt.count }} <small>{{ pct }}%</small></span>
    </li>
    {%- endfor %}
  </ul>
</figure>
