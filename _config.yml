title: The Refract Foundation
tagline: "Digital Literacy for West Midlands Schools"
description: "Refract is a youth-led initiative closing gaps in digital skills, confidence and opportunity for young people across the West Midlands."
url: https://refractfoundation.org
encoding: utf-8

# Contact details used in the footer and on the contact page.
email: hello@refractfoundation.org
linkedin: https://linkedin.com/company/refractfoundation

locale: en_GB
logo: /assets/images/brand/refract-full-colour.svg
social:
  name: The Refract Foundation
  links:
    - https://linkedin.com/company/refractfoundation

# Share image (a key in _data/photos.yml) for pages with no cover or hero photo of their own.
# See _plugins/seo_defaults.rb.
default_share_photo: haven-west-midlands-2026-000

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-target-blank

# Content lives in collections. Each document sets its own permalink so the
# public URLs stay exactly as they were (/our-work/haven, /news/hackuk-campfire).
collections:
  events:
    output: true
  programmes:
    output: true
  census_reports:
    output: true
  institutions:
    output: true
    permalink: /our-work/census/institutions/:name

defaults:
  - scope: { path: "", type: events }
    values: { layout: event }
  - scope: { path: "", type: programmes }
    values: { layout: programme, seo: { type: WebPage } }
  - scope: { path: "", type: census_reports }
    values: { layout: census-report }
  - scope: { path: "", type: institutions }
    values: { layout: institution }
  - scope: { path: "", type: posts }
    values: { layout: post }

# Stylesheet is assets/css/main.scss, built from _sass/.
sass:
  style: compressed
  sourcemap: never

exclude:
  - README.md
  - README.MD
  - CLAUDE.md
  - docs
  - LICENSE
  - "*.gem"
  - "*.gemspec"
  - Gemfile.lock
  - package.json
  - package-lock.json
  - vercel.json
  - scripts
  - node_modules
