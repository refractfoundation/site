<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include header.html %}
    <main id="main-content" tabindex="-1">
      <div class="hero hero--video d-flex flex-column justify-content-center align-items-center text-center">
        <video id="hero-video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="/img/CF_BIRMINGHAM_0072.JPG"
          aria-hidden="true"
        >
          <source src="/vid/Refract Hero.mp4" type="video/mp4" />
        </video>
        <script>
          (function () {
            var media = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
            if (!media || !media.matches) return;

            var video = document.getElementById("hero-video");
            if (!video) return;

            try {
              video.pause();
              video.removeAttribute("autoplay");
              video.removeAttribute("loop");

              video.querySelectorAll("source").forEach(function (source) {
                source.removeAttribute("src");
              });

              video.load();
            } catch (e) {
              // no-op
            }
          })();
        </script>
        <div class="hero-content">
          <h1>{{ page.hero_title }}</h1>
          <h2>{{ page.hero_sub }}</h2>
        </div>
      </div>
      <div class="content container my-3">{{ content }}</div>
    </main>
    {% include footer.html %}
  </body>
</html>
