---
layout: default
---
<article class="section">
  <div class="wrap post">
    <a class="post__back" href="/news">&larr; Back to news</a>
    <h1 class="rule">{{ page.title }}</h1>
    <p class="meta">
      <span>{{ page.author }}</span>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    </p>
    {%- if page.cover %}
    <div class="post__cover">
      {% include picture.html photo=page.cover eager=true sizes="(max-width: 960px) 100vw, 900px" %}
    </div>
    {%- endif %}
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>

{% include donate.html %}
