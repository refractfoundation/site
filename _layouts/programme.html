<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include header.html %}
    <main id="main-content" tabindex="-1" class="programme-page"{% if page.hero_colour %} style="--accent: {{ page.hero_colour }};"{% endif %}>
      <div
        class="hero hero--image d-flex flex-column justify-content-center align-items-center text-center"
        style="--hero-image: url('{{ page.hero_back }}'); --hero-overlay: {{ page.hero_overlay | default: 'rgba(26, 24, 24, 0.273)' }}; --hero-position-y: {{ page.hero_position_y | default: '-30vh' }};"
      >
        <img src="{{ page.hero_logo }}" alt="{{ page.hero_alt }}" class="hero-logo{% if page.hero_logo_wide %} hero-logo--wide{% endif %}" />
        {% if page.hero_date %}
          <p class="hero-meta">{{ page.hero_date }}</p>
          {% if page.hero_loc %}<p class="hero-submeta">{{ page.hero_loc }}</p>{% endif %}
        {% else %}
          <h3>{{ page.hero_sub }}</h3>
        {% endif %}
      </div>
      <div class="content container my-5">{{ content }}</div>
    </main>
    {% include footer.html %}
  </body>
</html>
