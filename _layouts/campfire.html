<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include header.html %}
    <main id="main-content" tabindex="-1">
      <div
        class="hero hero--image d-flex flex-column justify-content-center align-items-center text-center"
        style="--hero-image: url('{{ page.hero_back }}'); --hero-overlay: rgba(0, 0, 0, 0.5); --hero-position-y: -40vh;"
      >
        <img src="{{ page.hero_logo }}" alt="{{ page.hero_alt }}" class="hero-logo" />
        <p class="hero-meta">{{ page.hero_date }}</p>
        <p class="hero-submeta">{{ page.hero_loc }}</p>
      </div>
      <div class="content container my-3">{{ content }}</div>
    </main>
    {% include footer.html %}
  </body>
</html>
