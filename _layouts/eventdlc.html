<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main id="main-content" tabindex="-1">
      <div
        class="hero hero--image d-flex flex-column justify-content-center align-items-center text-center"
        style="--hero-image: url('{{ page.hero_back }}'); --hero-overlay: rgba(26, 24, 24, 0.273); --hero-position-y: -30vh;"
      >
        <img src="{{ page.hero_logo }}" alt="{{ page.hero_alt }}" class="hero-logo hero-logo--wide" />
        <p class="hero-meta">{{ page.hero_sub }}</p>
      </div>
      <div class="content container my-3">{{ content }}</div>
    </main>
    {% include footer.html %}
  </body>
</html>
